<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Management')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('students')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Student Management', null)}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="saas-card">
                <div class="card-header-clean">
                    <div>
                        <h6 class="card-title-clean">All Registered Students</h6>
                        <p class="card-subtitle-clean">Manage enrollment records, departments, and academic status.</p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-saas-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                            <i class="bi bi-person-plus-fill me-1"></i> Add Student
                        </button>
                    </div>
                </div>

                <div class="card-body-clean p-0">
                    <div class="table-responsive">
                        <table class="table-clean">
                            <thead>
                                <tr>
                                    <th>Roll Number</th>
                                    <th>Student Name</th>
                                    <th>Email</th>
                                    <th>Department</th>
                                    <th>Course</th>
                                    <th>Semester</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${students}">
                                    <td>
                                        <span class="badge bg-light text-dark border font-monospace" th:text="${s.rollNumber}">2024-CS-001</span>
                                    </td>
                                    <td>
                                        <div class="fw-bold text-dark" th:text="${s.user.fullName}">Aarav Patel</div>
                                        <small class="text-muted" th:text="${s.user.phone}">+1-555-0100</small>
                                    </td>
                                    <td th:text="${s.user.email}">student@college.edu</td>
                                    <td th:text="${s.department != null ? s.department.code : 'N/A'}">CSE</td>
                                    <td th:text="${s.course != null ? s.course.name : 'N/A'}">B.Tech CS</td>
                                    <td>
                                        <span class="badge bg-secondary-subtle text-secondary" th:text="'Sem ' + ${s.currentSemester}">Sem 3</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${s.user.active} ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'"
                                              th:text="${s.user.active} ? 'Active' : 'Deactivated'">Active</span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <a th:href="@{/admin/students/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary py-1 px-2" title="View Profile & Academic Record">
                                                <i class="bi bi-person-lines-fill"></i> Record
                                            </a>
                                            <form th:action="@{/admin/students/{id}/toggle-status(id=${s.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-light border py-1 px-2"
                                                        th:title="${s.user.active} ? 'Deactivate Student' : 'Activate Student'">
                                                    <i th:class="${s.user.active} ? 'bi bi-person-x text-danger' : 'bi bi-person-check text-success'"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Student Modal -->
<div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" style="border-radius: 14px;">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addStudentModalLabel"><i class="bi bi-person-plus-fill text-primary me-2"></i>Register New Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/students/create}" method="post">
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" name="fullName" placeholder="e.g. Maya Krishnan" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">College Email ID *</label>
                            <input type="email" class="form-control" name="email" placeholder="maya.k@college.edu" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Initial Password *</label>
                            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" name="phone" placeholder="+1-555-0155">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Roll / Registration Number *</label>
                            <input type="text" class="form-control" name="rollNumber" placeholder="e.g. 2024-CS-005" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Department *</label>
                            <select class="form-select" name="departmentId" required>
                                <option value="" disabled selected>Select Department</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name + ' (' + d.code + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Course Program *</label>
                            <select class="form-select" name="courseId" required>
                                <option value="" disabled selected>Select Course</option>
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Semester *</label>
                            <input type="number" class="form-control" name="semester" min="1" max="8" value="1" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Academic Year *</label>
                            <input type="text" class="form-control" name="academicYear" value="2026-2027" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-saas-outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-saas-primary">Create Student Account</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
