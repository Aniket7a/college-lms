<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Course Management')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('courses')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Degree Programs & Courses', null)}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="saas-card">
                <div class="card-header-clean">
                    <div>
                        <h6 class="card-title-clean">College Degree Programs</h6>
                        <p class="card-subtitle-clean">Undergraduate & postgraduate degree curricula</p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-saas-primary" data-bs-toggle="modal" data-bs-target="#addCourseModal">
                            <i class="bi bi-plus-circle me-1"></i> Create Course
                        </button>
                    </div>
                </div>

                <div class="card-body-clean p-0">
                    <table class="table-clean">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Program Name</th>
                                <th>Department</th>
                                <th>Duration</th>
                                <th>Semesters</th>
                                <th>Total Subjects</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${courses}">
                                <td><span class="badge bg-light text-dark border font-monospace" th:text="${c.code}">BTECH-CSE</span></td>
                                <td class="fw-bold text-dark" th:text="${c.name}">Bachelor of Technology in Computer Science</td>
                                <td th:text="${c.department.name + ' (' + c.department.code + ')'}">CSE</td>
                                <td th:text="${c.durationYears} + ' Years'">4 Years</td>
                                <td th:text="${c.totalSemesters} + ' Semesters'">8 Semesters</td>
                                <td>
                                    <span class="badge bg-primary-subtle text-primary" th:text="${c.subjects.size()} + ' Subjects'">4 Subjects</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Course Modal -->
<div class="modal fade" id="addCourseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius: 14px;">
            <div class="modal-header">
                <h5 class="modal-title fw-bold"><i class="bi bi-journal-bookmark-fill text-primary me-2"></i>Create Degree Program</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/courses/create}" method="post">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Course Code *</label>
                        <input type="text" class="form-control" name="code" placeholder="e.g. BTECH-AI" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Course Name *</label>
                        <input type="text" class="form-control" name="name" placeholder="e.g. B.Tech Artificial Intelligence" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Department *</label>
                        <select class="form-select" name="departmentId" required>
                            <option value="" disabled selected>Select Department</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small fw-semibold">Duration (Years)</label>
                            <input type="number" class="form-control" name="durationYears" value="4" min="1" max="6" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold">Total Semesters</label>
                            <input type="number" class="form-control" name="totalSemesters" value="8" min="1" max="12" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-saas-outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-saas-primary">Save Course</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
