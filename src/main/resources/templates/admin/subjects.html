<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Subject Management')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('subjects')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Subject & Curriculum Management', null)}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="saas-card">
                <div class="card-header-clean">
                    <div>
                        <h6 class="card-title-clean">Academic Subjects</h6>
                        <p class="card-subtitle-clean">Semester subjects, credit distribution, and assigned instructors</p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-saas-primary" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
                            <i class="bi bi-plus-circle me-1"></i> Add Subject
                        </button>
                    </div>
                </div>

                <div class="card-body-clean p-0">
                    <div class="table-responsive">
                        <table class="table-clean">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Subject Name</th>
                                    <th>Department</th>
                                    <th>Course</th>
                                    <th>Semester</th>
                                    <th>Credits</th>
                                    <th>Assigned Teacher</th>
                                    <th>Enrolled</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${subjects}">
                                    <td><span class="badge bg-light text-dark border font-monospace" th:text="${s.code}">CS301</span></td>
                                    <td>
                                        <div class="fw-bold text-dark" th:text="${s.name}">Data Structures</div>
                                        <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;" th:text="${s.description}"></small>
                                    </td>
                                    <td th:text="${s.department != null ? s.department.code : 'N/A'}">CSE</td>
                                    <td th:text="${s.course != null ? s.course.code : 'N/A'}">BTECH-CSE</td>
                                    <td><span class="badge bg-secondary-subtle text-secondary" th:text="'Sem ' + ${s.semester}">Sem 3</span></td>
                                    <td th:text="${s.credits}">4</td>
                                    <td>
                                        <span th:if="${s.teacher != null}" class="badge bg-success-subtle text-success">
                                            <i class="bi bi-person-check me-1"></i> <span th:text="${s.teacher.fullName}">Dr. Sharma</span>
                                        </span>
                                        <span th:unless="${s.teacher != null}" class="badge bg-warning-subtle text-warning">Unassigned</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${s.enrollments.size()}">0</span>
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2"
                                                data-bs-toggle="modal" th:data-bs-target="'#assignModal' + ${s.id}">
                                            <i class="bi bi-person-gear"></i> Assign
                                        </button>

                                        <!-- Assign Teacher Modal -->
                                        <div class="modal fade" th:id="'assignModal' + ${s.id}" tabindex="-1">
                                            <div class="modal-dialog">
                                                <div class="modal-content" style="border-radius: 12px;">
                                                    <div class="modal-header">
                                                        <h6 class="modal-title fw-bold" th:text="'Assign Teacher: ' + ${s.name}">Assign Teacher</h6>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <form th:action="@{/admin/subjects/{id}/assign-teacher(id=${s.id})}" method="post">
                                                        <div class="modal-body p-4">
                                                            <label class="form-label small fw-semibold">Select Faculty Instructor</label>
                                                            <select class="form-select" name="teacherId" required>
                                                                <option value="" disabled selected>Select Teacher</option>
                                                                <option th:each="t : ${teachers}" th:value="${t.id}"
                                                                        th:selected="${s.teacher != null && s.teacher.id == t.id}"
                                                                        th:text="${t.fullName + ' (' + t.email + ')'}"></option>
                                                            </select>
                                                        </div>
                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-sm btn-saas-outline" data-bs-dismiss="modal">Cancel</button>
                                                            <button type="submit" class="btn btn-sm btn-saas-primary">Confirm Assignment</button>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Subject Modal -->
<div class="modal fade" id="addSubjectModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" style="border-radius: 14px;">
            <div class="modal-header">
                <h5 class="modal-title fw-bold"><i class="bi bi-book-half text-primary me-2"></i>Create New Subject</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/subjects/create}" method="post">
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Subject Code *</label>
                            <input type="text" class="form-control" name="code" placeholder="e.g. CS401" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold">Subject Name *</label>
                            <input type="text" class="form-control" name="name" placeholder="e.g. Operating Systems" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Department *</label>
                            <select class="form-select" name="departmentId" required>
                                <option value="" disabled selected>Select Department</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Course Program *</label>
                            <select class="form-select" name="courseId" required>
                                <option value="" disabled selected>Select Course</option>
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Semester (1-8) *</label>
                            <input type="number" class="form-control" name="semester" min="1" max="8" value="3" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Credits *</label>
                            <input type="number" class="form-control" name="credits" min="1" max="6" value="4" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Assign Initial Teacher (Optional)</label>
                            <select class="form-select" name="teacherId">
                                <option value="">-- Unassigned --</option>
                                <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Subject Description / Syllabus Outline</label>
                            <textarea class="form-control" name="description" rows="3" placeholder="Brief summary of syllabus and topics covered..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-saas-outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-saas-primary">Save Subject</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
