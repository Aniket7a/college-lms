<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quiz Attempts - ' + ${quiz.title})}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('quizzes')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Student Quiz Attempts', null)}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Quiz Summary Header -->
            <div class="saas-card p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge bg-primary-subtle text-primary font-monospace mb-2" th:text="${quiz.subject.code}">CS301</span>
                        <h4 class="fw-bold text-dark mb-1" th:text="${quiz.title}">DSA Mid-Term</h4>
                        <div class="text-muted small">
                            <span>Max Marks: <strong class="text-dark" th:text="${quiz.totalMarks}">20</strong></span> &bull;
                            <span>Pass Mark: <strong class="text-dark" th:text="${quiz.passingMarks}">8</strong></span> &bull;
                            <span>Attempts Received: <strong class="text-dark" th:text="${attempts.size()}">1</strong></span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <form th:action="@{/teacher/quizzes/{id}/toggle-release(id=${quiz.id})}" method="post">
                            <button type="submit" class="btn btn-sm" th:classappend="${quiz.resultsReleased} ? 'btn-success' : 'btn-outline-secondary'">
                                <i class="bi" th:classappend="${quiz.resultsReleased} ? 'bi-eye-fill me-1' : 'bi-eye-slash-fill me-1'"></i>
                                <span th:text="${quiz.resultsReleased} ? 'Results Released' : 'Release Results to Students'">Release</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Attempts Table -->
            <div class="saas-card">
                <div class="card-header-clean">
                    <h6 class="card-title-clean">Submitted Student Attempts</h6>
                </div>
                <div class="card-body-clean p-0">
                    <div th:if="${#lists.isEmpty(attempts)}" class="text-center py-5 text-muted small">
                        No students have attempted this quiz yet.
                    </div>
                    <div class="table-responsive" th:unless="${#lists.isEmpty(attempts)}">
                        <table class="table-clean">
                            <thead>
                                <tr>
                                    <th>Roll Number</th>
                                    <th>Student</th>
                                    <th>Start Time</th>
                                    <th>Submit Time</th>
                                    <th>Auto / Total Score</th>
                                    <th>Evaluation Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="att : ${attempts}">
                                    <td><span class="badge bg-light text-dark border font-monospace" th:text="${att.student.rollNumber}">2024-CS-001</span></td>
                                    <td class="fw-bold text-dark" th:text="${att.student.user.fullName}">Aarav Patel</td>
                                    <td class="small text-muted" th:text="${#temporals.format(att.startTime, 'dd MMM, HH:mm:ss')}">Time</td>
                                    <td class="small text-muted" th:text="${att.submitTime != null ? #temporals.format(att.submitTime, 'dd MMM, HH:mm:ss') : 'In Progress'}">Time</td>
                                    <td>
                                        <span class="fw-bold fs-6 text-dark" th:text="${att.score} + ' / ' + ${quiz.totalMarks}">18 / 20</span>
                                        <span class="badge ms-1" th:classappend="${att.passed} ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'"
                                              th:text="${att.passed} ? 'Passed' : 'Failed'">Passed</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${att.evaluated} ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'"
                                              th:text="${att.evaluated} ? 'Evaluated' : 'Needs Subjective Review'">Status</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/teacher/quizzes/attempt/{id}/evaluate(id=${att.id})}" class="btn btn-sm btn-outline-primary py-1 px-2">
                                            <i class="bi bi-pencil-square"></i> Review Answers
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
