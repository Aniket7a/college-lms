<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - College LMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<div class="auth-container">
    <div class="auth-card">
        <!-- Logo & Branding -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem; border-radius: 12px;">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1" style="letter-spacing: -0.02em;">College LMS Portal</h3>
            <p class="text-muted small">Academic Learning & Course Management System</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small border-0 shadow-sm rounded-3">
            <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small border-0 shadow-sm rounded-3">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
        </div>

        <!-- Demo Accounts Quick Fill -->
        <div class="card bg-light border-0 p-3 mb-4 rounded-3">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="small fw-bold text-muted text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.05em;">Demo Quick Login</span>
                <span class="badge bg-primary-subtle text-primary small">1-Click</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-white border shadow-sm small py-1 px-2" onclick="fillCredentials('admin@college.edu', 'admin123')">
                    <i class="bi bi-shield-lock-fill text-danger me-1"></i> Admin
                </button>
                <button type="button" class="btn btn-sm btn-white border shadow-sm small py-1 px-2" onclick="fillCredentials('dr.sharma@college.edu', 'teacher123')">
                    <i class="bi bi-person-badge-fill text-primary me-1"></i> Teacher
                </button>
                <button type="button" class="btn btn-sm btn-white border shadow-sm small py-1 px-2" onclick="fillCredentials('student1@college.edu', 'student123')">
                    <i class="bi bi-mortarboard text-success me-1"></i> Student
                </button>
            </div>
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-dark">Email / College ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="name@college.edu" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label small fw-semibold text-dark">Password</label>
                    <a href="javascript:void(0)" onclick="alert('For demo purposes, default passwords are admin123, teacher123, or student123.')" class="text-decoration-none small text-muted">Forgot password?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                    <label class="form-check-label small text-muted" for="remember-me">Remember me</label>
                </div>
            </div>

            <button type="submit" class="btn btn-saas-primary w-100 py-2 fw-semibold">
                Sign In to LMS <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Secure Role-Based Academic Management &bull; 2026-2027</span>
        </div>
    </div>
</div>

<script>
    function fillCredentials(email, pwd) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = pwd;
    }
</script>
</body>
</html>
