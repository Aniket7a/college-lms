<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('notifications')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Notification Center', null)}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="saas-card">
                <div class="card-header-clean">
                    <div>
                        <h6 class="card-title-clean">All Notifications</h6>
                        <p class="card-subtitle-clean">Stay informed with assignments, quiz results, evaluation feedback, and announcements.</p>
                    </div>
                    <div>
                        <form th:action="@{/notifications/read-all}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-saas-outline"><i class="bi bi-check2-all me-1"></i>Mark all as read</button>
                        </form>
                    </div>
                </div>

                <div class="card-body-clean p-0">
                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                        <i class="bi bi-bell-slash text-muted" style="font-size: 3rem;"></i>
                        <h6 class="mt-3 text-dark fw-bold">No Notifications</h6>
                        <p class="text-muted small">You're all caught up with your academic updates.</p>
                    </div>

                    <div class="list-group list-group-flush" th:unless="${#lists.isEmpty(notifications)}">
                        <div th:each="n : ${notifications}" class="list-group-item p-3 d-flex align-items-start justify-content-between" th:classappend="${!n.isRead} ? 'bg-light'">
                            <div class="d-flex gap-3 align-items-start">
                                <div class="stat-icon" style="width: 40px; height: 40px; font-size: 1.1rem;"
                                     th:classappend="${n.type == 'MARKS' ? 'emerald' : (n.type == 'ASSIGNMENT' ? 'blue' : (n.type == 'QUIZ' ? 'purple' : 'amber'))}">
                                    <i th:class="${n.type == 'MARKS' ? 'bi bi-award' : (n.type == 'ASSIGNMENT' ? 'bi bi-file-earmark-text' : (n.type == 'QUIZ' ? 'bi bi-patch-question' : 'bi bi-info-circle'))}"></i>
                                </div>
                                <div>
                                    <h6 class="mb-1 fw-bold text-dark" th:text="${n.title}">Notification Title</h6>
                                    <p class="mb-1 text-muted small" th:text="${n.message}">Notification detailed message goes here.</p>
                                    <div class="d-flex align-items-center gap-2 small text-muted">
                                        <span th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                                        <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.65rem;" th:text="${n.type}">TYPE</span>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <a th:if="${n.linkUrl != null}" th:href="@{${n.linkUrl}}" class="btn btn-sm btn-outline-primary py-1 px-2 small">
                                    View <i class="bi bi-arrow-right"></i>
                                </a>
                                <form th:if="${!n.isRead}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-light border py-1 px-2" title="Mark read">
                                        <i class="bi bi-check"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
